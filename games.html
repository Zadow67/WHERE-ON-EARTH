<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WhereOnEarth</title>

    <link rel="stylesheet" href="games.css">
<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>
<link rel="preconnect" href="https://fonts.googleapis.com"> <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Press+Start+2P&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <div class="header-content">
            <p class="logo">WHERE<span>ON</span>EARTH?</p>
            <p class="round">Round <span id="currentRound">01</span> / 05</p>
            <p class="score">SCORE <span id="scoreNumber">00000</span></p>
        </div>
    </header>
    <main>
    <div class="game-grid">
        <div class="street-veiw-box">
        <iframe
            id="street-view"
            width="100%"
            height="100%"
            style="border:0"
            allowfullscreen>
        </iframe>
        </div>
        <div class="map-view-box">
            <div class="map-header">
                <p>Make your guess</p>
                <button></button>
                <button></button>
            </div>
        <div class="map-view"></div>

            <div class="make-guess">
                <button id="nextRound">Make Guess</button>
            </div>
        </div>
    </div>
    </main>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="games.js"></script>
</body>
</html>
